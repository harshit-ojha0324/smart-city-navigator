name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      # Hermetic: no outbound MTA/LLM calls — deterministic planner + simulated feed.
      NAVIGATOR_SIMULATE_FEED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit + integration tests (incl. live MCP servers over streamable HTTP)
        run: pytest -q
      # Every set has now been tuned against (each was scored once, then the
      # gaps it found were fixed), so all four must stay perfect. The honest
      # first-run scores are recorded in the README; the next held-out set
      # written should start at its own measured bar, not at 100%.
      - name: Eval — all four prompt sets (must be 100%)
        run: python eval/run_eval.py --set all --threshold 1.0
