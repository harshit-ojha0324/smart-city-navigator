name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      # Hermetic: no outbound MTA/LLM calls — deterministic planner + simulated feed.
      NAVIGATOR_SIMULATE_FEED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Unit + integration tests
        run: pytest -q
      - name: 20-prompt eval suite (must be 100%)
        run: python eval/run_eval.py --threshold 1.0
