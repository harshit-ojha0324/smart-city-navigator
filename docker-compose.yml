# The full system: 3 MCP tool servers + the Flask SSE gateway that reasons over
# them. `docker compose up` then open http://localhost:8000
services:
  alerts:
    build: .
    command: python -m navigator.mcp_servers.alerts_server
    environment:
      NAVIGATOR_SIMULATE_FEED: ${NAVIGATOR_SIMULATE_FEED:-0}

  routing:
    build: .
    command: python -m navigator.mcp_servers.routing_server

  geocode:
    build: .
    command: python -m navigator.mcp_servers.geocode_server

  gateway:
    build: .
    command: python -m navigator.gateway.app
    depends_on: [alerts, routing, geocode]
    ports: ["8000:8000"]
    environment:
      NAVIGATOR_TRANSPORT: mcp
      NAVIGATOR_ALERTS_HOST: alerts
      NAVIGATOR_ROUTING_HOST: routing
      NAVIGATOR_GEOCODE_HOST: geocode
      # Reasoner: unset means the deterministic planner. Point at a hosted
      # model with GEMINI_API_KEY, or at a local one on the host with
      # NAVIGATOR_LLM_PROVIDER=ollama and
      # NAVIGATOR_LLM_BASE_URL=http://host.docker.internal:11434
      NAVIGATOR_LLM_PROVIDER: ${NAVIGATOR_LLM_PROVIDER:-auto}
      NAVIGATOR_MODEL: ${NAVIGATOR_MODEL:-}
      NAVIGATOR_LLM_BASE_URL: ${NAVIGATOR_LLM_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
